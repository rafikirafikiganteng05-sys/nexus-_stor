function copyWA(id){var p=D.prods.filter(function(x){return x.id==id})[0];if(!p)return;var price=(p.disc&&p.disc<p.price)?p.disc:p.price,msg=D.deliverTemplate.replace("{nama}",p.name).replace("{harga}",rp(price)).replace("{link}",p.link||"(link belum diisi)");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(function(){alert("Pesan disalin!")})}else{prompt("Salin manual:",msg)}}
function exportData(){var blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nexus-store-backup.json";a.click()}
async function getDB(){if(!window.claude)return null;try{return await claude.use("db")}catch(e){return null}}
async function loadDash(){var el=document.getElementById("dash");if(!el)return;var db=await getDB();if(!db){el.innerHTML="<p>Dashboard hanya tampil saat Admin dibuka lewat akun Claude pemilik toko.</p>";return}try{var start=new Date();start.setHours(0,0,0,0);var snap=await db.collection("orders").where("ts",">=",start.getTime()).get();var docs=snap.docs,count=docs.length,omzet=0,freq={};docs.forEach(function(d){var o=d.data();omzet+=o.price||0;freq[o.name]=(freq[o.name]||0)+1});var top="-",max=0;for(var k in freq)if(freq[k]>max){max=freq[k];top=k}el.innerHTML="<div class='k3'><div style='background:var(--accent)'><b>"+count+"</b>PESANAN</div><div style='background:var(--grn)'><b style='font-size:18px'>"+rp(omzet)+"</b>OMZET</div><div style='background:var(--yel);color:#140a06'><b style='font-size:12px'>"+esc(top)+"</b>TERLARIS</div></div>"}catch(e){el.innerHTML="<p>Gagal memuat dashboard.</p>"}}
async function logOrder(id){var p=D.prods.filter(function(x){return x.id==id})[0];if(!p)return;var db=await getDB();if(!db)return alert("Fitur ini perlu dibuka lewat akun Claude pemilik toko.");var price=(p.disc&&p.disc<p.price)?p.disc:p.price,wa=ev("w"+id)||"";await db.collection("orders").add({name:p.name,price:price,wa:wa,ts:Date.now(),status:"lunas"});alert("Pesanan dicatat!");loadDash()}
async function searchOrder(){var w=ev("sq"),el=document.getElementById("sres");if(!w)return;var db=await getDB();if(!db){el.innerHTML="<p>Perlu akun Claude pemilik toko.</p>";return}var snap=await db.collection("orders").where("wa","==",w).orderBy("ts","desc").limit(5).get();el.innerHTML=snap.empty?"<p>Tidak ditemukan.</p>":snap.docs.map(function(d){var o=d.data();return "<div class='tbl'><span>"+esc(o.name)+"</span><span>"+rp(o.price)+"</span><span>"+new Date(o.ts).toLocaleDateString("id-ID")+"</span></div>"}).join("")}
function login(){var e=document.getElementById("pw"),b=document.getElementById("pwerr");if(e.value===PASS){authed=true;go()}else{b.style.display="block";b.textContent="❌ Kata kunci salah, coba lagi."}}
function upd(id,f,v){D.prods.forEach(function(p){if(p.id==id)p[f]=f=="price"?+v:v});save()}
function del(id){if(confirm("Hapus produk?")){D.prods=D.prods.filter(function(p){return p.id!=id});save();go()}}
function addP(){var n=ev("an"),p=+ev("ap");if(!n||!p)return alert("Isi nama dan harga");D.prods.push({id:Date.now(),cat:ev("ac"),name:n,price:p,desc:ev("ad")});save();go()}
function addBugSet(){var base=ev("bn");if(!base)return alert("Isi nama dasar dulu");var desc=ev("bd")||"Pilih role/tingkatan setelah order.",img=ev("bi")||"",lines=ev("br").split("\n"),n=0;lines.forEach(function(l){var parts=l.split(":");if(parts.length<2)return;var role=parts[0].trim(),price=+parts[1].trim();if(!role||!price)return;D.prods.push({id:Date.now()+n,cat:"bug",name:base+" - "+role,price:price,desc:desc,img:img});n++});if(!n)return alert("Format role:harga tidak terbaca, contoh: Member:10000");save();go();alert(n+" role ditambahkan!")}
function saveTheme(){D.theme={bg:ev("c1"),card:ev("c2"),accent:ev("c3"),text:ev("c4"),custom:true};save();theme();alert("Tema tersimpan")}
function resetTheme(){D.theme={bg:"#fbf6ea",card:"#fffdf7",accent:"#e62b2b",text:"#140a06",custom:false,skin:""};save();location.reload()}
function presetTheme(name){var p={hotwheels:{bg:"#1a1a1a",card:"#232323",accent:"#ff7a00",text:"#fff8e7"},mcqueen:{bg:"#2b0a0a",card:"#3d0f0f",accent:"#e8111c",text:"#ffd400"},racing:{bg:"#18181b",card:"#27272a",accent:"#ef4444",text:"#fafafa"},komik:{bg:"#fff6e5",card:"#ffffff",accent:"#d6002a",text:"#111111"},anime:{bg:"#e8eaff",card:"#ffffff",accent:"#5b6ee1",text:"#1a1a2e"},minecraft:{bg:"#8ec7f2",card:"#7b4a2d",accent:"#3fa34d",text:"#ffffff",skin:"minecraft"}}[name];if(!p)return;D.theme={bg:p.bg,card:p.card,accent:p.accent,text:p.text,custom:true,skin:p.skin||""};save();theme();go()}
function toggleFeat(key,val){D.features[key]=val;save();go()}
function mv(i,d){var a=D.layout.home,j=i+d;if(j<0||j>=a.length)return;var x=a[i];a[i]=a[j];a[j]=x;save();go()}
function img(el,k,w){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);D[k]=c.toDataURL(k=="qr"?"image/png":"image/jpeg",.85);save();theme();go()};im.src=r.result};r.readAsDataURL(f)}
function addT(){var n=ev("tn"),t=ev("tt");if(!n||!t)return;D.testi.unshift({n:n,t:t});save();go()}
function sendWA(){var m=ev("cm");if(!m)return;window.open("https://wa.me/"+D.wa+"?text="+encodeURIComponent((ev("cn")||"Pengunjung")+": "+m),"_blank")}
